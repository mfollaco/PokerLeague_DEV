name: Trigger private weekly build

on:
  push:
    branches:
      - main
    paths:
      - "data/incoming/*.csv"

  workflow_dispatch:
    inputs:
      csv_path:
        description: "CSV to process"
        required: true
        default: "data/incoming/09.08.26 log.csv"
        type: string

permissions:
  contents: read

jobs:
  trigger-private-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify CSV
        id: csv
        shell: bash
        env:
          MANUAL_CSV: ${{ inputs.csv_path }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CSV_PATH="$MANUAL_CSV"
          else
            CSV_PATH="$(git diff --name-only HEAD^ HEAD \
              | grep '^data/incoming/.*\.csv$' \
              | head -n 1)"
          fi

          if [ -z "$CSV_PATH" ]; then
            echo "No incoming CSV found."
            exit 1
          fi

          if [[ ! "$CSV_PATH" =~ ^data/incoming/[0-9]{2}\.[0-9]{2}\.[0-9]{2}\ log\.csv$ ]]; then
            echo "Invalid CSV path: $CSV_PATH"
            exit 1
          fi

          if [ ! -f "$CSV_PATH" ]; then
            echo "CSV does not exist: $CSV_PATH"
            exit 1
          fi

          echo "path=$CSV_PATH" >> "$GITHUB_OUTPUT"
          echo "Processing: $CSV_PATH"

      - name: Trigger private validator/build
        env:
          PRIVATE_BUILD_TOKEN: ${{ secrets.PRIVATE_BUILD_TOKEN }}
          CSV_PATH: ${{ steps.csv.outputs.path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          jq -n \
            --arg csv_path "$CSV_PATH" \
            --arg source_sha "$SOURCE_SHA" \
            '{
              ref: "main",
              inputs: {
                csv_path: $csv_path,
                source_sha: $source_sha
              }
            }' > payload.json

          curl --fail-with-body \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PRIVATE_BUILD_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mfollaco/PokerLeavue_Development/actions/workflows/process_public_upload.yml/dispatches \
            -d @payload.json

      - name: Confirm dispatch
        run: |
          echo "Private build successfully triggered."
          echo "CSV: ${{ steps.csv.outputs.path }}"
          echo "Source commit: ${{ github.sha }}"
